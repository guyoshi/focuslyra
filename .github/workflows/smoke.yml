name: Focuslyra smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app

      - name: Validate frontend JavaScript
        run: |
          node --check static/app.js
          node --check static/learning.js
          node --check static/voice-settings.js
          node --check static/phase2.js

      - name: Validate JSON data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('data').glob('*.json'):
              with path.open(encoding='utf-8') as f:
                  json.load(f)
              print('OK', path)
          PY

      - name: Validate adaptive study and learning v2 services
        env:
          ALLOW_PAID_AI: "false"
        run: |
          python - <<'PY'
          from app.db import initialise_database, connection
          from app.language_service import load_languages
          from app.session_planner import build_daily_plan
          from app.activity_engine import generate_activity
          from app.review_service import due_reviews, materialise_review_targets
          from app.concept_service import save_concept, list_concepts
          from app.memory_index import index_status, retrieve
          from app.progress_service import learner_progress
          from app.diagnostic_service import start_english_diagnostic, get_attempt
          from app.plan_calendar_service import load_settings

          initialise_database()
          languages = load_languages()
          english = next(item for item in languages if item['code'] == 'en-GB')
          assert english['priority'] == 1
          assert english['status'] == 'active'
          assert 'RP' in english['target_variety']

          plan = build_daily_plan('minimum')
          assert plan['activities']
          assert all(item['modality'] in {'speak','listen','write','read','pronounce'} for item in plan['activities'])
          activity = generate_activity(plan['activities'][0])
          assert activity['language_code'] == plan['activities'][0]['language_code']
          assert activity['modality'] == plan['activities'][0]['modality']

          with connection() as conn:
              conn.execute("INSERT INTO evidence_events(user_id, session_id, language_code, item_id, modality, event_type, score, payload_json, created_at) VALUES ('local-owner', NULL, 'en-GB', 'should have', 'speaking', 'review_target', NULL, '{}', datetime('now'))")
              conn.commit()
          materialise_review_targets()
          assert due_reviews()['due_count'] >= 1
          review_influenced_plan = build_daily_plan('minimum')
          assert all(item['modality'] in {'speak','listen','write','read','pronounce'} for item in review_influenced_plan['activities'])
          assert any('should have' in item.get('hidden_targets', []) for item in review_influenced_plan['activities'] if item['language_code'] == 'en-GB')

          concept = save_concept({'label':'dog','visual':'🐕','expressions':{'en-GB':{'text':'dog'}}})
          assert concept['label'] == 'dog'
          assert list_concepts()

          assert isinstance(index_status(), list)
          assert retrieve('anything', limit=2) == []

          progress = learner_progress()
          assert 'languages' in progress and 'totals' in progress

          diagnostic = start_english_diagnostic()
          assert len(diagnostic['tasks']) == 6
          assert get_attempt(diagnostic['id'])['status'] == 'in_progress'

          settings = load_settings()
          assert 'auto_schedule' in settings
          print('Learning v2 services OK')
          PY

      - name: Import application and route table
        env:
          ALLOW_PAID_AI: "false"
        run: |
          python - <<'PY'
          from app.main import app
          assert app.title == 'Focuslyra'
          paths = {route.path for route in app.routes}
          required = {
              '/api/review/due', '/api/concepts', '/api/memory/search', '/api/progress',
              '/api/diagnostic/english/start', '/api/calendar/schedule-plan', '/api/voice/catalog'
          }
          missing = required - paths
          assert not missing, missing
          print('Focuslyra import + v2 routes OK')
          PY
